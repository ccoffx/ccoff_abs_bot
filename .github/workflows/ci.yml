name: Check and build candidate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CGO_ENABLED: "1"
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Deployment failure and rollback rehearsal
        run: python3 scripts/test_deploy.py
      - name: Release promotion failure and retry rehearsal
        run: python3 scripts/test_release.py
      - name: Shell syntax
        run: for file in deploy.sh scripts/*.sh; do bash -n "$file"; done
  candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an existing immutable SHA candidate on retries
        id: existing
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(mktemp); registry_error=$(mktemp)
          if docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" > "$manifest" 2> "$registry_error"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "digest=$(awk '/^Digest:/ {print $2; exit}' "$manifest")" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|not found|NAME_UNKNOWN|MANIFEST_UNKNOWN' "$registry_error"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$registry_error" >&2
            exit 1
          fi
      - name: Build both native CGO architectures
        if: steps.existing.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  smoke:
    name: Container maintenance smoke test (${{ matrix.platform }})
    needs: candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Separate runners prevent Docker's classic image store from loading two
      # platform variants of the same manifest-list digest into one daemon.
      - name: Container maintenance smoke test
        env:
          IMAGE: ${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: ./scripts/image-smoke.sh "$IMAGE" "$PLATFORM"
  bundle:
    name: Package verified candidate
    needs: [candidate, smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Source-free deployment bundle
        env:
          IMAGE: ${{ needs.candidate.outputs.image }}
          DIGEST: ${{ needs.candidate.outputs.digest }}
        run: |
          ./scripts/package-release.sh
          jq -n --arg commit "$GITHUB_SHA" --arg image "$IMAGE@$DIGEST" '{commit:$commit,image:$image,schemaCompatibility:"1",coverage:"Mock ABS and Telegram group tests; real ABS compatibility and real group permissions are not verified."}' > dist/candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.sha }}
          path: dist/*
          retention-days: 90
