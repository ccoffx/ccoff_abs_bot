name: Promote tested candidate
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character main-branch candidate SHA tested on Mac
        required: true
        type: string
      version:
        description: New immutable release version, e.g. v1.0.0
        required: true
        type: string
      private_chat_tested:
        description: I verified this exact candidate with the independent test Bot
        required: true
        default: false
        type: boolean
      database_compatible:
        description: I verified fresh database initialization and restart with schema baseline 1
        required: true
        default: false
        type: boolean
permissions:
  contents: write
  packages: write
  actions: read
concurrency:
  group: release-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: inputs.private_chat_tested && inputs.database_compatible && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ inputs.commit }}
      VERSION: ${{ inputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - name: Validate release and successful candidate build
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ && "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh api "repos/$REPO/git/ref/tags/$VERSION" >/dev/null 2>&1; then echo 'Version tag already exists'; exit 1; fi
          run_id=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --branch main --event push --status success --json databaseId --jq '.[0].databaseId // empty')
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
          gh run download "$run_id" --repo "$REPO" --name "deployment-$SHA" --dir dist
          test "$(jq -r .commit dist/candidate.json)" = "$SHA"
          test "$(jq -r .schemaCompatibility dist/candidate.json)" = 1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested manifest without rebuilding
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          pin=$(jq -r .image dist/candidate.json)
          [[ "$pin" == "$IMAGE@sha256:"* && "${pin#*@sha256:}" =~ ^[a-f0-9]{64}$ ]]
          manifest=$(mktemp)
          registry_error=$(mktemp)
          trap 'rm -f "$manifest" "$registry_error"' EXIT
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > "$manifest" 2> "$registry_error"; then
            existing=$(awk '/^Digest:/ {print $2; exit}' "$manifest")
            if [[ "$pin" != "$IMAGE@$existing" ]]; then
              echo 'Image version already exists with a different digest; refusing to overwrite' >&2
              exit 1
            fi
            echo 'Resuming promotion of the same immutable image'
          elif grep -Eqi 'manifest unknown|MANIFEST_UNKNOWN|: not found$' "$registry_error"; then
            docker buildx imagetools create --tag "$IMAGE:$VERSION" "$pin"
          else
            cat "$registry_error" >&2
            exit 1
          fi
          # Consume the complete output before parsing: awk exiting early in a
          # pipe can make buildx fail with a broken pipe under pipefail.
          docker buildx imagetools inspect "$IMAGE:$VERSION" > "$manifest"
          promoted=$(awk '/^Digest:/ {print $2; exit}' "$manifest")
          if [[ "$pin" != "$IMAGE@$promoted" ]]; then
            echo 'Promoted image digest does not match the tested candidate' >&2
            exit 1
          fi
          jq --arg version "$VERSION" '. + {version:$version}' dist/candidate.json > dist/release.json
      - name: Publish deployment files and verification boundaries
        shell: bash
        run: |
          cat > dist/notes.md <<EOF
          Candidate commit: $SHA
          Immutable image: $(jq -r .image dist/release.json)
          Database compatibility group: 1 (current schema baseline; development databases are unsupported).

          Automated unit, transaction, concurrency, fresh database initialization, restart and mock Telegram/ABS tests passed. The operator confirmed private-chat acceptance on the exact candidate.

          Verification boundary: mock ABS does not establish real ABS API compatibility. Simulated group tests do not establish real Telegram group permissions or rendering. First production deployment still needs basic real-service checks.

          Download deployment.tar.gz and its checksum; no application source or Go compiler is needed on the deployment device. See docs/deployment.md inside the archive.
          EOF
          gh release create "$VERSION" --repo "$REPO" --target "$SHA" --title "$VERSION" --notes-file dist/notes.md dist/deployment.tar.gz dist/deployment.tar.gz.sha256 dist/release.json
